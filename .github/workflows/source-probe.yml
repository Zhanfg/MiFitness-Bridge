name: Verify Xiaomi market probe
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/source-probe.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source parser tests
        run: python3 -m unittest discover -s tests -v
