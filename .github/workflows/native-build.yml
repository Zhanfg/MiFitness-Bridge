name: Build native Zygisk Next diagnostic
on:
  push:
    paths:
      - 'native/**'
      - 'root-module/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'root-module/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK 27
        run: yes | sdkmanager --install 'ndk;27.2.12479018'
      - name: Configure
        run: cmake -S native -B out-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
      - name: Build
        run: cmake --build out-native --parallel 2
      - name: Inspect and package
        run: |
          set -eu
          file out-native/libmifitness_bridge.so
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D out-native/libmifitness_bridge.so | grep -F zygisk_module_entry
          for f in root-module/customize.sh root-module/service.sh root-module/action.sh; do sh -n "$f"; done
          mkdir -p stage/zygisk
          cp root-module/module.prop root-module/customize.sh root-module/service.sh root-module/action.sh root-module/bridge.conf stage/
          chmod 0755 stage/customize.sh stage/service.sh stage/action.sh
          cp out-native/libmifitness_bridge.so stage/zygisk/arm64-v8a.so
          (cd stage && zip -qr ../MiFitnessBridge-v0.4.0-ZN-diagnostic.zip .)
          unzip -l MiFitnessBridge-v0.4.0-ZN-diagnostic.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MiFitnessBridge-v0.4.0-ZN-diagnostic
          path: MiFitnessBridge-v0.4.0-ZN-diagnostic.zip
          retention-days: 14
