name: Build native Zygisk Next calendar bridge
on:
  push:
    paths:
      - 'native/**'
      - 'java/**'
      - 'scripts/**'
      - 'root-module/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'java/**'
      - 'scripts/**'
      - 'root-module/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mifitness-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.14206865'
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'
          fi
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35'
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Java policy unit tests
        run: |
          set -euxo pipefail
          mkdir -p build/testclasses
          find java/hostmocks java/tests -name '*.java' -print0 | xargs -0 javac --release 8 -d build/testclasses \
            java/src/dev/axymorrsen/mifitness/GatePolicy.java \
            java/src/dev/axymorrsen/mifitness/BackupInvoker.java \
            java/src/dev/axymorrsen/mifitness/TargetResolver.java
          java -cp build/testclasses dev.axymorrsen.mifitness.GatePolicyTest
          java -cp build/testclasses dev.axymorrsen.mifitness.BackupInvokerTest
          java -cp build/testclasses dev.axymorrsen.mifitness.TargetResolverTest
      - name: Host systemization safety tests
        run: python3 -m unittest discover -s tests -p 'test_systemizer.py' -v
      - name: Compile callback DEX
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/java build/dex
          find java/src -name '*.java' -print0 | xargs -0 javac --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d build/java
          jar cf build/classes.jar -C build/java .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --release --output build/dex build/classes.jar
          test -s build/dex/classes.dex
      - name: Fetch pinned native dependencies
        run: bash scripts/fetch-native-deps.sh
      - name: Restore pinned NDK object cache
        uses: actions/cache@v4
        with:
          path: build/native
          key: mifitness-arm64-ndk29-${{ runner.os }}-${{ hashFiles('native/**', 'scripts/fetch-native-deps.sh', 'scripts/patch-lsplant-unhook.py') }}
          restore-keys: |
            mifitness-arm64-ndk29-${{ runner.os }}-
      - name: Compile arm64 native Zygisk payload
        run: |
          set -euxo pipefail
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static
          cmake --build build/native --target mifitness_bridge --parallel 3
          file build/native/libmifitness_bridge.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D build/native/libmifitness_bridge.so | grep 'zygisk_module_entry'
      - name: Package APK-free module
        shell: bash
        run: |
          set -euxo pipefail
          for script in root-module/customize.sh root-module/service.sh root-module/action.sh root-module/safe-mode.sh root-module/enable-calendar.sh root-module/guard.sh root-module/check-code.sh; do sh -n "$script"; done
          mkdir -p build/stage/zygisk build/stage/licenses
          cp root-module/module.prop root-module/customize.sh root-module/action.sh root-module/service.sh root-module/safe-mode.sh root-module/enable-calendar.sh root-module/guard.sh root-module/check-code.sh root-module/bridge.conf build/stage/
          cp build/dex/classes.dex build/stage/classes.dex
          cp build/native/libmifitness_bridge.so build/stage/zygisk/arm64-v8a.so
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/llvm-objcopy" --only-keep-debug build/stage/zygisk/arm64-v8a.so build/MiFitnessBridge-v0.5.2-arm64.debug
          "$TOOLCHAIN/llvm-strip" --strip-unneeded build/stage/zygisk/arm64-v8a.so
          "$TOOLCHAIN/llvm-nm" -D build/stage/zygisk/arm64-v8a.so | grep 'zygisk_module_entry'
          test "$(stat -c%s build/stage/zygisk/arm64-v8a.so)" -lt 5000000
          chmod 0755 build/stage/customize.sh build/stage/action.sh build/stage/service.sh build/stage/safe-mode.sh build/stage/enable-calendar.sh build/stage/guard.sh build/stage/check-code.sh
          cp build/dependency-versions.txt build/stage/
          for entry in "lsplant/LICENSE:LSPlant-LGPL3" "dobby/LICENSE:Dobby" "xdl/LICENSE:xDL-MIT"; do
            a="${entry%%:*}"; b="${entry##*:}"
            [ ! -f "third_party/$a" ] || cp "third_party/$a" "build/stage/licenses/$b"
          done
          (cd build/stage && sha256sum \
            zygisk/arm64-v8a.so classes.dex module.prop customize.sh service.sh \
            guard.sh check-code.sh action.sh safe-mode.sh enable-calendar.sh \
            > code-integrity.sha256)
          (cd build/stage && sh ./check-code.sh | grep -Fx 'code_integrity=matches_packaged_manifest')
          (cd build/stage && zip -qr ../MiFitnessBridge-v0.5.2-ZN-integrity-guard.zip .)
          unzip -l build/MiFitnessBridge-v0.5.2-ZN-integrity-guard.zip
          unzip -p build/MiFitnessBridge-v0.5.2-ZN-integrity-guard.zip module.prop | grep 'version=v0.5.2'
      - uses: actions/upload-artifact@v4
        with:
          name: MiFitnessBridge-v0.5.2-ZN-integrity-guard
          path: build/MiFitnessBridge-v0.5.2-ZN-integrity-guard.zip
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MiFitnessBridge-v0.5.2-arm64-debug-symbols
          path: build/MiFitnessBridge-v0.5.2-arm64.debug
          retention-days: 14
          if-no-files-found: error
